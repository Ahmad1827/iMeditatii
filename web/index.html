<!DOCTYPE html>
<html lang="ro">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="iMeditații - Învață și predă cu zâmbetul pe buze.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="iMeditații">
  <meta name="theme-color" content="#F7F8FA">

  <!-- The splash in the theme the app will open in: the one saved by the visitor
       (shared_preferences keeps it in localStorage), light when nothing is saved. -->
  <script>
    (function () {
      var dark = false;
      try { dark = localStorage.getItem('flutter.is_dark_mode') === 'true'; } catch (e) {}
      if (dark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#18191B');
      }
    })();
  </script>

  <!-- Favicon: open book with a spark (same drawing as BrandMark in the app) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2322C55E'/><stop offset='1' stop-color='%230F766E'/></linearGradient></defs><rect width='64' height='64' rx='18' fill='url(%23g)'/><path d='M32 31C27 27 20 26 13 28L13 49C20 47 27 48 32 52Z' fill='white'/><path d='M32 31C37 27 44 26 51 28L51 49C44 47 37 48 32 52Z' fill='white' fill-opacity='.78'/><path d='M32 9Q33.3 16.7 41 18Q33.3 19.3 32 27Q30.7 19.3 23 18Q30.7 16.7 32 9Z' fill='%23FDE68A'/></svg>">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>iMeditații</title>
  <link rel="manifest" href="manifest.json">

  <!-- Asked for while this page is still being read, not after the script
       before them has run: the app, its drawing engine and Firebase (the
       version is the one firebase_core loads; test/startup_test.dart checks). -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-functions.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-messaging.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js">

  <!-- The app's fonts are fetched before its first page is drawn. Asked for
       now, they arrive while the app itself is still downloading. -->
  <script>
    fetch('assets/FontManifest.json').then(function (r) { return r.json(); }).then(function (families) {
      families.forEach(function (family) {
        family.fonts.forEach(function (font) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
          link.href = 'assets/' + font.asset;
          document.head.appendChild(link);
        });
      });
    }).catch(function () {});
    // the home page's landscape, when it is the home page that opens
    if (location.pathname === new URL(document.baseURI).pathname) {
      var sky = document.createElement('link');
      sky.rel = 'preload';
      sky.as = 'fetch';
      sky.crossOrigin = 'anonymous';
      sky.href = 'assets/assets/images/background.jpg';
      document.head.appendChild(sky);
    }
  </script>

  <style>
    /* Same font as the app (Inter), from the app's own files */
    @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url('assets/assets/fonts/Inter-Regular.ttf') format('truetype'); }
    @font-face { font-family: 'Inter'; font-weight: 700; font-display: swap; src: url('assets/assets/fonts/Inter-Bold.ttf') format('truetype'); }

    :root {
      --page-top: #EAF3EC;
      --page-bottom: #F7F8FA;
      --surface: #FFFFFF;
      --border: rgba(0, 0, 0, 0.08);
      --text: #262626;
      --muted: #6B7280;
      --primary: #15803D;
      --track: #E5E7EB;
      --hill-1: #CFE5D4;
      --hill-2: #B5D6BD;
      --hill-3: #9CC7A7;
      --cloud: rgba(255, 255, 255, 0.85);
      --bird: #5B6B60;
      --shadow: 0 24px 60px rgba(21, 128, 61, 0.14), 0 6px 18px rgba(0, 0, 0, 0.06);
    }

    :root[data-theme="dark"] {
      --page-top: #1B2420;
      --page-bottom: #18191B;
      --surface: #242629;
      --border: rgba(255, 255, 255, 0.08);
      --text: #E6E6E6;
      --muted: #9CA3AF;
      --primary: #4ADE80;
      --track: #33363A;
      --hill-1: #1F2E26;
      --hill-2: #1A2820;
      --hill-3: #15211A;
      --cloud: rgba(255, 255, 255, 0.10);
      --bird: #B8C4BA;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--page-bottom);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: linear-gradient(180deg, var(--page-top) 0%, var(--page-bottom) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity .42s ease-out;
    }

    /* The app is drawn underneath: the card lets go first, the sky after it. */
    #loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loader.fade-out .card {
      opacity: 0;
      transform: translateY(-10px) scale(.98);
    }
    #loader.fade-out .hills {
      transform: translateY(28px);
    }

    /* ---------- soft clouds ---------- */
    .cloud {
      position: absolute;
      height: 38px;
      border-radius: 999px;
      background: var(--cloud);
      filter: blur(6px);
      animation: drift linear infinite;
    }
    .cloud.c1 { width: 190px; top: 14%; left: -220px; animation-duration: 60s; }
    .cloud.c2 { width: 260px; top: 26%; left: -300px; animation-duration: 84s; animation-delay: -30s; height: 46px; }
    .cloud.c3 { width: 150px; top: 8%;  left: -200px; animation-duration: 70s; animation-delay: -52s; }

    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 340px)); }
    }

    /* ---------- birds ---------- */
    .bird {
      position: absolute;
      left: -40px;
      width: 22px;
      height: 10px;
      animation: fly linear infinite;
    }
    .bird svg { width: 100%; height: 100%; overflow: visible; }
    .bird path {
      fill: none;
      stroke: var(--bird);
      stroke-width: 1.6;
      stroke-linecap: round;
      opacity: .6;
      animation: flap .5s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .bird.b1 { top: 20%; animation-duration: 26s; }
    .bird.b2 { top: 24%; animation-duration: 26s; animation-delay: .9s; transform: scale(.8); }
    .bird.b3 { top: 17%; animation-duration: 26s; animation-delay: 1.6s; transform: scale(.7); }

    @keyframes fly {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 80px)); }
    }
    @keyframes flap {
      from { transform: scaleY(1); }
      to   { transform: scaleY(.35); }
    }

    /* ---------- hills ---------- */
    .hills {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 36vh;
      min-height: 190px;
      pointer-events: none;
      transition: transform .42s ease-in;
    }
    .hills svg { position: absolute; bottom: 0; width: 100%; height: 100%; }

    /* ---------- card ---------- */
    .card {
      position: relative;
      z-index: 3;
      width: min(92vw, 380px);
      padding: 34px 32px 28px;
      border-radius: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards;
      transition: opacity .22s ease-out, transform .3s ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .mark {
      width: 48px;
      height: 48px;
      display: block;
      animation: bob 2.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 14px rgba(16, 185, 129, .35));
    }
    .mark .spark {
      transform-origin: 32px 18px;
      animation: twinkle 1.8s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50%      { transform: scale(.72) rotate(45deg); opacity: .75; }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    .word {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.5px;
      color: var(--text);
    }
    .word span { color: var(--primary); }

    .msg {
      min-height: 22px;
      font-size: 14.5px;
      color: var(--muted);
      margin-bottom: 16px;
      transition: opacity .25s ease;
    }
    .msg.swap { opacity: 0; }

    .track {
      height: 6px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: var(--primary);
      transform: scaleX(.04);
      transform-origin: left center;
      transition: transform .5s cubic-bezier(.25, .7, .3, 1);
    }
    .bar.done { transition-duration: .2s; }

    /* shown only when the app is late or couldn't be fetched */
    .retry {
      display: none;
      margin-top: 16px;
      padding: 9px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--primary);
      font: 600 14px 'Inter', system-ui, sans-serif;
      cursor: pointer;
    }
    .retry.show { display: inline-block; }
    .retry:hover { background: var(--track); }

    @media (prefers-reduced-motion: reduce) {
      .cloud, .bird, .mark, .mark .spark, .card { animation: none !important; }
      .bird { display: none; }
      #loader, .card, .hills, .bar { transition-duration: .01s !important; }
      #loader.fade-out .card, #loader.fade-out .hills { transform: none; }
    }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite" aria-label="Se încarcă iMeditații">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="bird b1"><svg viewBox="0 0 22 10"><path d="M1 6 Q6 0 11 5 Q16 0 21 6"/></svg></div>
    <div class="bird b2"><svg viewBox="0 0 22 10"><path d="M1 6 Q6 0 11 5 Q16 0 21 6"/></svg></div>
    <div class="bird b3"><svg viewBox="0 0 22 10"><path d="M1 6 Q6 0 11 5 Q16 0 21 6"/></svg></div>

    <div class="hills">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
        <path fill="var(--hill-1)" d="M0 150 C200 90 380 190 620 140 C860 90 1040 40 1240 100 C1340 130 1400 120 1440 110 L1440 320 L0 320 Z"/>
        <path fill="var(--hill-2)" d="M0 210 C220 150 420 250 700 200 C940 160 1120 120 1440 190 L1440 320 L0 320 Z"/>
        <path fill="var(--hill-3)" d="M0 270 C260 220 520 300 800 255 C1040 220 1240 240 1440 265 L1440 320 L0 320 Z"/>
      </svg>
    </div>

    <div class="card">
      <div class="logo">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="markg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#0F766E"/></linearGradient></defs>
          <rect width="64" height="64" rx="18" fill="url(#markg)"/>
          <path d="M32 31C27 27 20 26 13 28L13 49C20 47 27 48 32 52Z" fill="#fff"/>
          <path d="M32 31C37 27 44 26 51 28L51 49C44 47 37 48 32 52Z" fill="#fff" fill-opacity=".78"/>
          <path class="spark" d="M32 9Q33.3 16.7 41 18Q33.3 19.3 32 27Q30.7 19.3 23 18Q30.7 16.7 32 9Z" fill="#FDE68A"/>
        </svg>
        <div class="word"><span>i</span>Meditații</div>
      </div>
      <div class="msg" id="msg">Pregătim lecțiile…</div>
      <div class="track"><div class="bar" id="bar"></div></div>
      <button class="retry" id="retry" type="button" onclick="location.reload()">Reîncarcă pagina</button>
    </div>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('loader');
      var el = document.getElementById('msg');
      var bar = document.getElementById('bar');
      var retry = document.getElementById('retry');
      var done = false;

      function say(text) {
        el.classList.add('swap');
        setTimeout(function () { el.textContent = text; el.classList.remove('swap'); }, 220);
      }

      // friendly rotating messages
      var msgs = [
        'Pregătim lecțiile…',
        'Aprindem testele automate…',
        'Trezim dragonii…',
        'Adunăm profesorii…',
        'Aproape gata…'
      ];
      var i = 0;
      var timer = setInterval(function () {
        i = (i + 1) % msgs.length;
        say(msgs[i]);
      }, 1500);

      // The bar follows what has really arrived. Everything is asked for at
      // once, so each arrival adds its share, in whatever order they come;
      // in between, the bar creeps a little, so it never sits still and
      // never gets far ahead of the truth.
      var shares = [
        [/main\.dart\.js$/, 0.40],             // the app
        [/canvaskit\.wasm|skwasm.*\.wasm/, 0.20], // its drawing engine
        [/canvaskit\.js|skwasm.*\.js/, 0.04],
        [/firebase-app\.js/, 0.04],
        [/firebase-firestore\.js/, 0.06],
        [/firebase-auth\.js/, 0.04],
        [/Inter-Regular\.ttf/, 0.04],          // the fonts
        [/gsi\/client|assets\/\.env/, 0.08]     // asked for by the app itself: it is running
      ];
      var reached = 0.04, shown = 0.04, seen = {};
      function draw(v) {
        shown = Math.max(shown, Math.min(v, 1));
        bar.style.transform = 'scaleX(' + shown + ')';
      }
      function arrived(name) {
        for (var k = 0; k < shares.length; k++) {
          if (!seen[k] && shares[k][0].test(name)) { seen[k] = true; reached += shares[k][1]; }
        }
        draw(reached);
      }
      try {
        new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (e) { arrived(e.name); });
        }).observe({ type: 'resource', buffered: true });
      } catch (e) {}
      var creep = setInterval(function () {
        // a part of the way to a little past what has arrived, never onto the end
        var limit = Math.min(reached + 0.1, 0.95);
        draw(shown + (limit - shown) * 0.15);
      }, 400);

      // Late, or the app couldn't be fetched: say so and offer a way out,
      // instead of clouds drifting for ever.
      function trouble(text) {
        if (done) return;
        clearInterval(timer);
        say(text);
        retry.classList.add('show');
      }
      var late = setTimeout(function () {
        trouble(navigator.onLine === false ? 'Nu ești conectat la internet.' : 'Durează mai mult decât de obicei…');
      }, 20000);
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT' && /main\.dart\.js|flutter_bootstrap\.js|canvaskit/.test(t.src || '')) {
          trouble(navigator.onLine === false ? 'Nu ești conectat la internet.' : 'Aplicația nu s-a putut încărca.');
        }
      }, true);

      // The app has drawn its first page (in its own font, with its own data
      // on the way): the splash lifts off it at once. No waiting on purpose.
      window.addEventListener('flutter-first-frame', function () {
        done = true;
        clearInterval(timer);
        clearInterval(creep);
        clearTimeout(late);
        bar.classList.add('done');
        draw(1);
        // two frames, so the app's page is on the screen under the splash
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            loader.classList.add('fade-out');
            setTimeout(function () { loader.remove(); }, 460);
          });
        });
      }, { once: true });
    })();
  </script>

  <!-- Python and C++ run in the browser (web/py_runner.js, web/cpp_runner.js) -->
  <script src="py_runner.js" defer></script>
  <script src="cpp_runner.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Offline: web/sw.js keeps what was opened. On the first visit it starts
       after the app has loaded, so it is told what the page fetched before it. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register(new URL('sw.js', document.baseURI).href).catch(function (e) {
          console.warn('Service worker:', e);
        });
      });
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.ready.then(function (reg) {
          setTimeout(function () {
            var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            if (reg.active) reg.active.postMessage({ type: 'keep', urls: urls });
          }, 3000);
        });
      }, { once: true });
    }
  </script>
</body>
</html>
